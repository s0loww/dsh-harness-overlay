# Complete Agent composition derived from the pinned official rc.5 Standard preset.
# The airules provider is inside this composition, so its tools and skills do not
# enter Standard or any other Agent preset.
- insert:
    - id: preset-1c-airules
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: 1c-airules
        name: 1С
        description: 1С-разработка с embedded airules; MCP подключаются отдельно.
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: Ты — старший разработчик 1С:Предприятие 8 на модели {{model}}. Отвечай по-русски. Соблюдай embedded airules и проектные ограничения.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              instructionFileCandidates:
                - AGENTS.md
              localInstructionFileCandidates:
                - AGENTS.local.md
          - id: airules-policy
            name: airules-dsh-provider
            config:
              compositionScoped: true
              rulepackRoot: !!js dshHomePath('profiles/desktop/node_modules/airules-dsh-rulepack')
          # Optional project workflow tools are inserted by the policy builder.
          # Optional portable workbench tools are inserted by the policy builder.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # Real BSL diagnostics/actions are composition-scoped: Standard does
          # not receive lsp_* tools. Missing local BSL LS degrades to {}.
          - id: onec-lsp-actions
            name: dsh-lsp-actions
            inject: [tools, fs, subprocess]
            config:
              servers: !!js process.getBuiltinModule('node:module').createRequire(dshHomePath('profiles/desktop/node_modules/airules-official-onec-mechanics/package.json'))('./lsp-servers.cjs').lspActionsServers()
              editor:
                enabled: false
                requestTimeoutMs: 60000
                diagnosticsCacheMaxFiles: 64
              maxDiagnostics: 200
              maxCompletionItems: 20
              maxCodeActions: 50
              maxSymbols: 100
              maxSignatures: 10
              maxInlayHints: 200
              maxResultChars: 16000
              timeoutMs: 60000
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: airules-managed-delegation
                name: airules-dsh-model-orchestration/delegation
                config:
                  rulepackRoot: !!js dshHomePath('profiles/desktop/node_modules/airules-dsh-rulepack')
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              mode: timed
              timeout: -1
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
# The editor is a web/host plugin and therefore mounts at profile level. Its
# adapted HTTP surface rejects every session whose header.agentPreset is not
# exactly 1c-airules, so Standard gets neither editor access nor model tools.
- insert:
    - id: airules-telegram
      name: airules-dsh-telegram
    - id: airules-subscriptions
      name: airules-dsh-subscriptions
    - id: airules-mobile
      name: airules-dsh-mobile-access
    - id: airules-mcp-manager
      name: airules-dsh-mcp-manager
    - id: airules-additional-providers
      name: airules-dsh-additional-providers
    - id: airules-onec-panels
      name: airules-dsh-onec-panels
    - id: airules-project-settings
      name: airules-dsh-project-settings
    - id: airules-model-orchestration
      name: airules-dsh-model-orchestration
    - id: airules-domain-presets
      name: airules-dsh-domain-presets
    - id: airules-workflows
      name: airules-dsh-workflows
    - id: airules-agent-import
      name: airules-dsh-agent-import
    - id: airules-skills
      name: airules-dsh-skills
    - id: airules-general-tools
      name: airules-dsh-general-tools
    - id: airules-documents
      name: airules-dsh-document-workbench
    - id: airules-onec-capabilities
      name: airules-dsh-onec-capability-workflows
    - id: airules-acp
      name: airules-dsh-acp
    - id: airules-acp-adapter
      name: '@zaimokuza/dsh-acp-adapter'
      inject: [llm, sessions, subprocess, dshHomePath, attachments, sessionProjections, permissionPresets, acpPermissionPolicy]
      config:
        agents: {}
        toolApprovalDefault: ask
    - id: airules-openspec
      name: dsh-openspec-workflow
      config:
        timeoutMs: 15000
    - id: airules-onec-bsl-editor
      name: dsh-bsl-editor
      config:
        lspEnabled: false
        interceptChatOpen: true
- id: agent-preset-registry
  config:
    default: 1c-airules
